plugins {
	id 'java'
	id 'java-library'
	id 'org.springframework.boot' version "$SPRING_BOOT_VERSION"
	id 'io.spring.dependency-management'
}

dependencies {

	bootJar {
		enabled = false
	}

	jar {
		enabled = true
		archiveClassifier = ''
	}

	api project(':crnk-setup:crnk-setup-servlet')
	api project(':crnk-setup:crnk-setup-spring')
	compileOnly project(':crnk-data:crnk-data-jpa')
	compileOnly project(':crnk-validation')
	compileOnly project(':crnk-home')
	compileOnly project(':crnk-meta')
	compileOnly project(':crnk-operations')
	compileOnly project(':crnk-security')
	compileOnly project(':crnk-ui')
	compileOnly project(':crnk-client')
	compileOnly project(':crnk-data:crnk-data-facet')
	compileOnly project(':crnk-format:crnk-format-plain-json')
	compileOnly project(':crnk-monitor:crnk-monitor-opentracing')

	compileOnly 'io.opentracing:opentracing-api:0.31.0'

	compileOnlyApi "org.hibernate.orm:hibernate-core:$HIBERNATE_CORE_VERSION"
	compileOnlyApi "org.springframework.boot:spring-boot-starter-web:$SPRING_BOOT_VERSION"
	compileOnlyApi "org.springframework.boot:spring-boot-configuration-processor:$SPRING_BOOT_VERSION"
	compileOnlyApi "org.springframework.boot:spring-boot-starter-actuator:$SPRING_BOOT_VERSION"
	compileOnlyApi "org.springframework.boot:spring-boot-starter-validation:$SPRING_BOOT_VERSION"
	compileOnlyApi "org.springframework.security:spring-security-core:$SPRING_SECURITY_VERSION"
	compileOnlyApi "org.springframework:spring-orm:$SPRING_FRAMEWORK_VERSION"

	testImplementation  project(':crnk-data:crnk-data-jpa')
	testImplementation  project(':crnk-validation')
	testImplementation (project(':crnk-home')) {
		// Conflicts with Logback
		exclude group: 'org.slf4j', module: 'slf4j-simple'
	}
	testImplementation  project(':crnk-meta')
	testImplementation  project(':crnk-operations')
	testImplementation  project(':crnk-security')
	testImplementation  project(':crnk-ui')
	testImplementation  project(':crnk-client')
	testImplementation  project(':crnk-test')
	testImplementation  project(':crnk-data:crnk-data-facet')
	testImplementation  project(':crnk-format:crnk-format-plain-json')

	testImplementation  "org.springframework.boot:spring-boot-starter-data-jpa:$SPRING_BOOT_VERSION"
	testImplementation  "org.springframework.boot:spring-boot-starter-web:$SPRING_BOOT_VERSION"
	testImplementation  "org.springframework.boot:spring-boot-starter-test:$SPRING_BOOT_VERSION"
	testImplementation  "org.springframework.boot:spring-boot-starter-actuator:$SPRING_BOOT_VERSION"
	testImplementation  "org.springframework.boot:spring-boot-starter-validation:$SPRING_BOOT_VERSION"

	testImplementation	"org.hibernate.orm:hibernate-core:$HIBERNATE_CORE_VERSION"
	testImplementation  'com.h2database:h2'

	testImplementation  "org.springframework.boot:spring-boot-configuration-processor:$SPRING_BOOT_VERSION"
	testImplementation  "org.springframework:spring-orm:$SPRING_FRAMEWORK_VERSION"
	testImplementation  "org.springframework.security:spring-security-core:$SPRING_SECURITY_VERSION"
	testImplementation  "net.javacrumbs.json-unit:json-unit-assertj:$JSON_UNIT_VERSION"
	testImplementation  'org.mockito:mockito-core:5.5.0'
	testImplementation  'pl.pragmatists:JUnitParams:1.1.1'
}


