plugins {
	id 'java'
	id 'java-library'
}

dependencies {

	implementation project(':crnk-core')

	api  project(':crnk-test')
	api  project(':crnk-meta')
	api  "net.javacrumbs.json-unit:json-unit:$JSON_UNIT_VERSION"
	api  group: 'nl.jqno.equalsverifier', name: 'equalsverifier', version: '1.7.2'
	api  group: 'com.jayway.jsonpath', name: 'json-path', version: '2.2.0'

	api  group: 'junit', name: 'junit', version: '4.13.1'
	api  group: 'org.mockito', name: 'mockito-core', version: '5.5.0'
	api  "org.assertj:assertj-core:$ASSERTJ_CORE_VERSION"

	testImplementation  'com.google.guava:guava:31.1-jre'
}
