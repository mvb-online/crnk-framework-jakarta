plugins {
	id 'java'
	id 'java-library'
	id 'org.springframework.boot' version "$SPRING_BOOT_VERSION"
	id 'io.spring.dependency-management'
	id 'application'
}

mainClassName = "io.crnk.example.springboot.microservice.MinimalSpringBootApplication"

dependencies {

	implementation project(':crnk-setup:crnk-setup-spring-boot3')
	implementation (project(':crnk-home')) {
		// Conflicts with Logback
		exclude group: 'org.slf4j', module: 'slf4j-simple'
	}

	implementation "org.springframework.boot:spring-boot-starter-web:$SPRING_BOOT_VERSION"

	testImplementation  "org.junit.jupiter:junit-jupiter-api:$JUNIT_VERSION"
	testImplementation  "org.junit.jupiter:junit-jupiter-params:$JUNIT_VERSION"
	testImplementation  "org.junit.jupiter:junit-jupiter-engine:$JUNIT_VERSION"
	testImplementation  "org.junit.vintage:junit-vintage-engine:$JUNIT_VERSION"

	testImplementation  project(':crnk-client')
	testImplementation  "com.squareup.okhttp3:okhttp:$OKHTTP_VERSION"
	testImplementation  "io.rest-assured:rest-assured:$REST_ASSURED_VERSION"
	testImplementation  "io.rest-assured:json-schema-validator:$REST_ASSURED_VERSION"
	testImplementation  "org.springframework.boot:spring-boot-starter-test:$SPRING_BOOT_VERSION"
	testImplementation  'commons-io:commons-io:2.14.0'

}
