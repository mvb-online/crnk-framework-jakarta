plugins {
	id 'java'
	id 'java-library'
}

dependencies {
    api project(':crnk-core')

	api 'org.apache.httpcomponents:httpclient:4.5.13'
	api "org.glassfish.jersey.ext:jersey-proxy-client:$JERSEY_VERSION"
	api "org.glassfish.jersey.core:jersey-common:$JERSEY_VERSION"
	api "org.glassfish.jersey.core:jersey-client:$JERSEY_VERSION"
	api "org.glassfish.jersey.core:jersey-server:$JERSEY_VERSION"
	api "org.glassfish.jersey.media:jersey-media-json-jackson:$JERSEY_VERSION"
	api "com.squareup.okhttp3:okhttp:$OKHTTP_VERSION"
	api 'com.fasterxml.jackson.jakarta.rs:jackson-jakarta-rs-json-provider:2.15.4'

    testImplementation  project(':crnk-setup:crnk-setup-rs')
    testImplementation  project(':crnk-test')

}
